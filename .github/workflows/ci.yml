name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON }}
      NEON_PROJECT_ID: damp-wildflower-79510538
      NEON_BRANCH: ci-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      isolated: ${{ steps.mode.outputs.isolated }}
    steps:
      - id: mode
        run: echo "isolated=${{ env.NEON_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g pnpm@10
      # No lockfile is committed yet (dev environment has no npm access); versions are pinned in package.json.
      - run: pnpm install --no-frozen-lockfile
      # Isolated database for this run: a Neon branch copied from dev, shared by the unit tests and e2e of this run
      # and deleted by the `db-cleanup` job. Without the NEON secret, both jobs fall back to the shared dev DB.
      - name: Branch expiry (safety net if cleanup never runs)
        if: env.NEON_API_KEY != ''
        id: expiry
        run: echo "at=$(date -u -d '+6 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Neon branch for this run
        if: env.NEON_API_KEY != ''
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ env.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: ${{ env.NEON_BRANCH }}
          database: forms
          role: forms_owner
          expires_at: ${{ steps.expiry.outputs.at }}
      - run: pnpm typecheck
      - run: node scripts/eslint-annotations.mjs
      - run: pnpm test
        env:
          # This run's Neon branch (or the shared dev DB); enables tests/requests-store.test.ts (skipped when unset).
          DATABASE_URL: ${{ steps.neon.outputs.db_url || secrets.DATABASE_URL }}
      # Shared dev DB only: e2e (which cleans up at its end) does not run when this job fails, so clean here instead.
      # An isolated run's branch is simply deleted.
      - run: pnpm exec tsx scripts/clean-test-data.ts
        if: failure() && env.NEON_API_KEY == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Hebrew PDF sample
        if: always()
        run: |
          pnpm pdf:sample
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftoppm -png -r 110 artifacts/hebrew-sample.pdf artifacts/hebrew-sample
          pdftoppm -png -r 110 artifacts/certificate-sample.pdf artifacts/certificate-sample
          pdftoppm -png -r 110 artifacts/stamps-sample.pdf artifacts/stamps-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hebrew-sample
          path: artifacts/
          if-no-files-found: ignore
  e2e:
    runs-on: ubuntu-latest
    # After the unit tests, so the cleanup at the end of e2e also removes what they created.
    needs: check
    # On the shared dev DB only one e2e run at a time, since its teardown removes all test data
    # (tests/e2e/clean-test-data.ts). With a Neon branch per run there is nothing shared, so no lock.
    concurrency:
      group: ${{ needs.check.outputs.isolated == 'true' && format('e2e-{0}-{1}', github.run_id, github.run_attempt) || 'e2e-dev-db' }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON }}
      NEON_PROJECT_ID: damp-wildflower-79510538
      NEON_BRANCH: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g pnpm@10
      - run: pnpm install --no-frozen-lockfile
      # Same branch the check job created (the action returns the existing one).
      - name: Branch expiry (safety net if cleanup never runs)
        if: env.NEON_API_KEY != ''
        id: expiry
        run: echo "at=$(date -u -d '+6 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Neon branch for this run
        if: env.NEON_API_KEY != ''
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ env.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: ${{ env.NEON_BRANCH }}
          database: forms
          role: forms_owner
          expires_at: ${{ steps.expiry.outputs.at }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url || secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
  # Deletes this run's Neon branch, whatever happened to the tests.
  db-cleanup:
    needs: [check, e2e]
    if: always() && needs.check.outputs.isolated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          api_key: ${{ secrets.NEON }}
          project_id: damp-wildflower-79510538
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}
  # Publishes rendered PDF previews to the `ci-previews` branch so they can be
  # reviewed from environments that cannot download Actions artifacts.
  previews:
    needs: check
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g pnpm@10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm pdf:sample
      - run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: |
          pdftoppm -png -r 110 artifacts/hebrew-sample.pdf artifacts/hebrew-sample
          pdftoppm -png -r 110 artifacts/certificate-sample.pdf artifacts/certificate-sample
          pdftoppm -png -r 110 artifacts/stamps-sample.pdf artifacts/stamps-sample
      - name: Push previews branch
        run: |
          mkdir /tmp/previews && cp artifacts/* /tmp/previews/
          cd /tmp/previews
          git init -q -b ci-previews
          git config user.name "ci-previews"
          git config user.email "ci-previews@users.noreply.github.com"
          echo "Generated from ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "previews for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-previews
