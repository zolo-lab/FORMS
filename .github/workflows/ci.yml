name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g pnpm@10
      # No lockfile is committed yet (dev environment has no npm access); versions are pinned in package.json.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Hebrew PDF sample
        if: always()
        run: |
          pnpm pdf:sample
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftoppm -png -r 110 artifacts/hebrew-sample.pdf artifacts/hebrew-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hebrew-sample
          path: artifacts/
          if-no-files-found: ignore
